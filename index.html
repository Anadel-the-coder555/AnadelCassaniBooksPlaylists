<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Anadel's Novels Music Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ?v= on script.js/styles.css below: bump this any time either file
     changes, so browsers/CDNs (GitHub Pages included) fetch the new version
     instead of possibly serving a stale cached one alongside fresh HTML —
     that mismatch is what causes "old JS looking for an element the new HTML
     doesn't have" crashes. -->
<link rel="stylesheet" href="styles.css?v=20260934">
</head>
<body>

<div id="libraryView" class="library-view">
  <div class="library-header">
    <div>
      <div class="library-title">Novel Songs</div>
      <div class="library-sub">Albums</div>
    </div>
    <button class="add-music-btn" id="addMusicBtn" title="Add music" aria-label="Add music">+ Add Music</button>
  </div>
  <div class="library-top-actions">
    <button class="library-action-btn" id="allSongsBtn">All Songs</button>
    <button class="library-action-btn primary" id="playAllBtn">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l13 7-13 7z"/></svg>
      Play All
    </button>
  </div>

  <div class="album-carousel" id="albumCarousel">
    <div class="album-carousel-stage" id="albumCarouselStage"></div>
    <div class="album-carousel-caption">
      <div class="album-carousel-name" id="albumCarouselName">—</div>
      <div class="album-carousel-count" id="albumCarouselCount"></div>
    </div>
  </div>

  <div class="song-list hidden" id="songListView"></div>
</div>

<div class="upload-overlay hidden" id="uploadOverlay">
  <div class="upload-panel">
    <div class="upload-panel-header">
      <div class="upload-panel-title">Add Music</div>
      <button class="upload-close-btn" id="uploadCloseBtn" title="Close" aria-label="Close">✕</button>
    </div>
    <div class="upload-hint">Saved in this browser only — it stays here until you remove it.</div>
    <div class="upload-storage" id="uploadStorageUsage"></div>

    <div class="upload-mode-tabs">
      <button class="upload-mode-btn active" id="uploadModeOneBtn" data-mode="one">One Song</button>
      <button class="upload-mode-btn" id="uploadModeManyBtn" data-mode="many">Many Songs</button>
    </div>

    <div id="uploadOneFields">
      <label class="upload-field">
        <span>Audio file</span>
        <input type="file" id="uploadAudioInput" accept="*/*">
      </label>
      <label class="upload-field">
        <span>Cover image (optional)</span>
        <input type="file" id="uploadImageInput" accept="image/*">
      </label>
      <label class="upload-field">
        <span>Title</span>
        <input type="text" id="uploadTitleInput" placeholder="Song title">
      </label>
      <label class="upload-field">
        <span>Album</span>
        <input type="text" id="uploadAlbumInput" placeholder="Leave blank for “Uploads”" list="albumSuggestions">
      </label>
      <label class="upload-field-checkbox">
        <input type="checkbox" id="uploadHolidayInput">
        <span>Holiday / Christmas track</span>
      </label>
    </div>

    <div id="uploadManyFields" class="hidden">
      <label class="upload-field">
        <span>Audio files — hold ⌘ and click each one (or ⌘A for all) in the dialog</span>
        <input type="file" id="uploadBulkAudioInput" accept="*/*" multiple>
      </label>
      <label class="upload-field">
        <span>Cover images (optional — matched to songs by filename, same ⌘-click to multi-select)</span>
        <input type="file" id="uploadBulkImageInput" accept="image/*" multiple>
      </label>
      <label class="upload-field">
        <span>Album (applied to all of these — optional)</span>
        <input type="text" id="uploadBulkAlbumInput" placeholder="Leave blank for “Uploads”" list="albumSuggestions">
      </label>
      <label class="upload-field-checkbox">
        <input type="checkbox" id="uploadBulkHolidayInput">
        <span>Mark all of these as Holiday / Christmas tracks</span>
      </label>
      <div class="upload-bulk-preview" id="uploadBulkPreview"></div>
    </div>

    <datalist id="albumSuggestions"></datalist>

    <div class="upload-actions">
      <div class="upload-progress" id="uploadProgress"></div>
      <button class="upload-save-btn" id="uploadSaveBtn">Add to Library</button>
    </div>
  </div>
</div>

<div class="upload-overlay hidden" id="editSongOverlay">
  <div class="upload-panel">
    <div class="upload-panel-header">
      <div class="upload-panel-title">Edit Song</div>
      <button class="upload-close-btn" id="editSongCloseBtn" title="Close" aria-label="Close">✕</button>
    </div>

    <label class="upload-field">
      <span>Cover image</span>
      <input type="file" id="editSongImageInput" accept="image/*">
    </label>
    <div class="edit-cover-current hidden" id="editSongCoverCurrent">
      <span>Current cover set.</span>
      <button type="button" class="edit-remove-cover-btn" id="editSongRemoveCoverBtn">Remove cover</button>
    </div>

    <label class="upload-field">
      <span>Title</span>
      <input type="text" id="editSongTitleInput" placeholder="Song title">
    </label>
    <label class="upload-field">
      <span>Album</span>
      <input type="text" id="editSongAlbumInput" placeholder="Leave blank for “Uploads”" list="albumSuggestions">
    </label>
    <label class="upload-field-checkbox">
      <input type="checkbox" id="editSongHolidayInput">
      <span>Holiday / Christmas track</span>
    </label>

    <div class="upload-actions">
      <div class="upload-progress" id="editSongProgress"></div>
      <button class="upload-save-btn" id="editSongSaveBtn">Save Changes</button>
    </div>
  </div>
</div>

<div class="player hidden" id="playerView">
  <div class="player-backdrop" id="playerBackdrop" aria-hidden="true">
    <div class="backdrop-layer" id="backdropLayerA"></div>
    <div class="backdrop-layer" id="backdropLayerB"></div>
    <div class="backdrop-scrim"></div>
  </div>

  <button class="back-btn" id="backBtn" title="Back to albums" aria-label="Back to albums">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 18l-6-6 6-6"/></svg>
    <span>Albums</span>
  </button>

  <div class="corner-controls-left">
    <button class="ctrl-btn small" id="likeBtn" title="Like this track" aria-label="Like this track">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.1 2 4.5 5.6 4c2.1-.3 4 .8 5 2.6C11.6 4.8 13.5 3.7 15.6 4c3.5.5 5.2 4.1 3.6 7.8C16.7 16.4 12 21 12 21Z"/></svg>
    </button>
    <button class="ctrl-btn small" id="shuffleBtn" title="Shuffle upcoming songs" aria-label="Shuffle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h3.5c1.7 0 2.6.9 3.6 2.2M3 18h3.5c1.7 0 2.6-.9 3.6-2.2M14 6h3.7c1.5 0 2.3.7 3 1.7M14 18h3.7c1.5 0 2.3-.7 3-1.7M17.5 3.5 21 6l-3.5 2.5M17.5 20.5 21 18l-3.5-2.5"/></svg>
    </button>
    <button class="ctrl-btn" id="prevBtn" title="Previous song" aria-label="Previous">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button class="ctrl-btn" id="playBtn" title="Play" aria-label="Play">
      <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M7 5l13 7-13 7z"/></svg>
    </button>
    <button class="ctrl-btn" id="nextBtn" title="Next song" aria-label="Next">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
  </div>

  <div class="player-main">
    <div class="player-carousel" id="playerCarousel">
      <div class="player-carousel-stage" id="playerCarouselStage">
        <!-- viewBox is much taller than the visible crest (y 60-160) on purpose: the
             fill below the wavy line closes at y=2000 instead of the old y=220, so
             stretching this box's CSS height still leaves the crest sitting near the
             top, undistorted, with the solid "water" running on far past it. -->
        <svg class="player-carousel-wave" viewBox="0 0 1200 2000" preserveAspectRatio="none" aria-hidden="true">
          <path id="playerWaveA" d="M0,110 C150,220 350,0 600,110 C850,220 1050,0 1200,110 L1200,2000 L0,2000 Z">
            <animate attributeName="d" dur="6s" repeatCount="indefinite"
              values="M0,110 C150,220 350,0 600,110 C850,220 1050,0 1200,110 L1200,2000 L0,2000 Z;
                      M0,110 C150,0 350,220 600,110 C850,0 1050,220 1200,110 L1200,2000 L0,2000 Z;
                      M0,110 C150,220 350,0 600,110 C850,220 1050,0 1200,110 L1200,2000 L0,2000 Z"/>
          </path>
          <path id="playerWaveB" d="M0,140 C200,10 400,270 600,140 C800,10 1000,270 1200,140 L1200,2000 L0,2000 Z">
            <animate attributeName="d" dur="4.5s" repeatCount="indefinite"
              values="M0,140 C200,10 400,270 600,140 C800,10 1000,270 1200,140 L1200,2000 L0,2000 Z;
                      M0,140 C200,270 400,10 600,140 C800,270 1000,10 1200,140 L1200,2000 L0,2000 Z;
                      M0,140 C200,10 400,270 600,140 C800,10 1000,270 1200,140 L1200,2000 L0,2000 Z"/>
          </path>
        </svg>
      </div>
    </div>

    <div class="now-playing">
      <div class="album-chip" id="albumChip">
        <span class="album-chip-art">
          <svg id="albumChipSvg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice"></svg>
          <img id="albumChipImg" alt="" style="display:none;">
        </span>
        <span class="album-chip-name" id="albumTag"></span>
      </div>

      <div class="track-meta">
        <div class="track-title" id="trackTitle">—</div>
      </div>

      <div class="progress-row" id="progressRow">
        <span id="curTime">0:00</span>
        <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
        <span id="totalTime">0:00</span>
      </div>
    </div>
  </div>
</div>

<script src="script.js?v=20260934"></script>
</body>
</html>
