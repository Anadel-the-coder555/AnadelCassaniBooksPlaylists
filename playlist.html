<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aether — Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14100f;
    --ink-soft:#1d1815;
    --parchment:#f3ebda;
    --parchment-dim:#cabfa9;
    --gold:#c9a961;
    --rose:#c2557b;
    --mist:#8f8676;
    --font-display:'Cormorant Garamond', serif;
    --font-body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{
    font-family:var(--font-body);
    color:var(--parchment);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .player{
    position:relative;
    width:94vw;
    max-width:1500px;
    aspect-ratio:16/9;
    max-height:90vh;
    border-radius:18px;
    overflow:hidden;
    background:var(--ink);
    box-shadow:0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,169,97,0.15);
  }
  .art-layer{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transition:opacity 0.5s ease;
  }
  .art-layer.fading{ opacity:0; }
  .landscape-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  #landscapeImg{
    object-fit:cover;
    object-position:center;
    display:none;
  }
  .scrim{
    position:absolute; inset:0;
    background:linear-gradient(to top, rgba(10,8,7,0.92) 0%, rgba(10,8,7,0.55) 32%, rgba(10,8,7,0.05) 58%, rgba(10,8,7,0.35) 100%);
    pointer-events:none;
  }

  /* queue panel */
  .queue-panel{
    position:absolute;
    top:clamp(22px, 3vw, 40px); left:clamp(24px, 3vw, 42px);
    max-width:52%;
    z-index:2;
  }
  .queue-label{
    font-family:var(--font-body);
    font-size:clamp(11px, 1vw, 14px);
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--gold);
    margin-bottom:10px;
    opacity:0.9;
  }
  #queueList{
    list-style:none; margin:0; padding:0;
    display:flex; flex-direction:column; gap:2px;
  }
  #queueList li{
    display:flex; align-items:baseline; gap:10px;
    padding:5px 8px 5px 2px;
    border-radius:6px;
    cursor:pointer;
    transition:background 0.2s ease, opacity 0.4s ease, transform 0.4s ease;
  }
  #queueList li:hover{ background:rgba(255,255,255,0.06); }
  #queueList li:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  #queueList .roman{
    font-family:var(--font-display);
    font-style:italic;
    font-size:14px;
    color:var(--gold);
    width:22px;
    flex-shrink:0;
    opacity:0.85;
  }
  #queueList .meta{ min-width:0; }
  #queueList .qtitle{
    font-family:var(--font-display);
    font-size:clamp(18px, 1.7vw, 27px);
    line-height:1.15;
    color:var(--parchment);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #queueList .qartist{
    font-size:clamp(11px, 0.95vw, 14px);
    color:var(--parchment-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #queueList li.entering{ opacity:0; transform:translateY(-6px); }

  /* now playing */
  .now-playing{
    position:absolute;
    left:0; right:0; bottom:0;
    z-index:2;
    padding:0 clamp(28px, 3.4vw, 46px) clamp(24px, 3vw, 40px);
  }
  .track-meta{ margin-bottom:14px; }
  .track-title{
    font-family:var(--font-display);
    font-style:italic;
    font-weight:600;
    font-size:clamp(28px,4.3vw,54px);
    line-height:1.1;
  }
  .track-artist{
    font-size:clamp(13px, 1.1vw, 17px);
    letter-spacing:0.04em;
    color:var(--parchment-dim);
    margin-top:4px;
  }
  .progress-row{
    display:flex; align-items:center; gap:10px;
    margin-bottom:16px;
  }
  .progress-row span{
    font-size:11px;
    font-variant-numeric:tabular-nums;
    color:var(--parchment-dim);
    width:34px;
  }
  .progress-row span:last-child{ text-align:right; }
  .progress-track{
    flex:1; height:3px;
    background:rgba(255,255,255,0.18);
    border-radius:2px;
    cursor:pointer;
    position:relative;
  }
  .progress-fill{
    position:absolute; left:0; top:0; bottom:0;
    width:0%;
    background:var(--gold);
    border-radius:2px;
  }
  .progress-fill::after{
    content:'';
    position:absolute; right:-4px; top:50%; transform:translateY(-50%);
    width:9px; height:9px; border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 0 3px rgba(201,169,97,0.18);
  }

  .controls-row{
    display:flex; align-items:center; justify-content:center; gap:22px;
  }
  .ctrl-btn{
    background:none; border:none; cursor:pointer;
    color:var(--parchment);
    display:flex; align-items:center; justify-content:center;
    width:clamp(38px, 4vw, 54px); height:clamp(38px, 4vw, 54px);
    border-radius:50%;
    transition:color 0.2s ease, background 0.2s ease, transform 0.15s ease;
  }
  .ctrl-btn:hover{ transform:translateY(-1px); }
  .ctrl-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .ctrl-btn svg{ width:clamp(20px, 2vw, 27px); height:clamp(20px, 2vw, 27px); }
  .ctrl-btn.small svg{ width:clamp(17px, 1.7vw, 23px); height:clamp(17px, 1.7vw, 23px); }
  .ctrl-btn.active{ color:var(--rose); }
  .play-btn{
    width:clamp(56px, 6vw, 80px); height:clamp(56px, 6vw, 80px);
    background:var(--rose);
    color:var(--ink);
  }
  .play-btn:hover{ background:#d06588; }
  .play-btn svg{ width:clamp(22px, 2.4vw, 32px); height:clamp(22px, 2.4vw, 32px); }

  @media (max-width:560px){
    .player{ aspect-ratio:3/4.4; border-radius:14px; }
    .queue-panel{ max-width:70%; }
    #queueList .qtitle{ font-size:16px; }
    .controls-row{ gap:14px; }
  }
</style>
</head>
<body>

<div class="player">
  <div class="art-layer" id="artLayer">
    <svg id="landscape" class="landscape-svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice"></svg>
    <img id="landscapeImg" class="landscape-svg" alt="" />
  </div>
  <div class="scrim"></div>

  <div class="queue-panel">
    <div class="queue-label">Up Next</div>
    <ul id="queueList"></ul>
  </div>

  <div class="now-playing">
    <div class="track-meta">
      <div class="track-title" id="trackTitle">—</div>
      <div class="track-artist" id="trackArtist">—</div>
    </div>

    <div class="progress-row">
      <span id="curTime">0:00</span>
      <div class="progress-track" id="progressTrack"><div class="progress-fill" id="progressFill"></div></div>
      <span id="totalTime">0:00</span>
    </div>

    <div class="controls-row">
      <button class="ctrl-btn small" id="likeBtn" title="Like this track" aria-label="Like this track">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7.5-4.6-10-9.2C.4 8.1 2 4.5 5.6 4c2.1-.3 4 .8 5 2.6C11.6 4.8 13.5 3.7 15.6 4c3.5.5 5.2 4.1 3.6 7.8C16.7 16.4 12 21 12 21Z"/></svg>
      </button>
      <button class="ctrl-btn small" id="shuffleBtn" title="Shuffle upcoming songs" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h3.5c1.7 0 2.6.9 3.6 2.2M3 18h3.5c1.7 0 2.6-.9 3.6-2.2M14 6h3.7c1.5 0 2.3.7 3 1.7M14 18h3.7c1.5 0 2.3-.7 3-1.7M17.5 3.5 21 6l-3.5 2.5M17.5 20.5 21 18l-3.5-2.5"/></svg>
      </button>
      <button class="ctrl-btn" id="prevBtn" title="Previous song" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
      </button>
      <button class="ctrl-btn play-btn" id="playBtn" title="Play" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5l13 7-13 7z"/></svg>
      </button>
      <button class="ctrl-btn" id="nextBtn" title="Next song" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button class="ctrl-btn small" id="addBtn" title="Add to library" aria-label="Add to library">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  // ---- PASTE YOUR TRACKS HERE ----
  // audio: your song file (local relative path, or a Dropbox ?dl=1 link).
  // image: optional. Leave it out (or set to null) to fall back to the generated landscape art.
    const trackData = [
        { audio: "bookSongs/Forgotten Beginning - Hey I Can't Dance!.mp3",        image: "bookSongsCovers/ForgottenBeginning.png" },
        { audio: "bookSongs/Converge - Collide.mp3", image: "bookSongsCovers/Converge.png" },
        { audio: "bookSongs/Falling For The Dragon - Falling For The Dragon.mp3", image: "bookSongsCovers/Falling.png" },
        { audio: "bookSongs/Talent Bones - Found In Me.mp3", image: "bookSongsCovers/TalentBones.png" },
        { audio: "bookSongs/Matchmaker's Revenge.mp3", image: "bookSongsCovers/Matchmaker.png" },
        { audio: "bookSongs/One Small Kiss.mp3", image: "bookSongsCovers/Blu.png" },
        { audio: "bookSongs/Survivor.mp3", image: "bookSongsCovers/ForgottenBeginning.png" },
        { audio: "bookSongs/Till I Met You.mp3", image: "bookSongsCovers/vow-beneath-the-spires.jpg" },
        { audio: "bookSongs/Wings.mp3", image: "bookSongsCovers/ForgottenBeginning.png" },
        { audio: "bookSongs/Ο Χορός των Αστεριών.mp3", image: "bookSongsCovers/Blu.png" },
        { audio: "bookSongs/Ooops I Did It Again.mp3", image: "bookSongsCovers/Matchmaker.png" },
        { audio: "bookSongs/I Remember.mp3", image: "bookSongsCovers/GravityThief.png" },
        { audio: "bookSongs/Wrong Way Up.mp3", image: "bookSongsCovers/GravityThief.png" },
        { audio: "bookSongs/Blu - Dance of The Stars.mp3", image: "bookSongsCovers/Blu.png" },
        { audio: "bookSongs/Resonance.mp3", image: "bookSongsCovers/Resonance.png" },
        { audio: "bookSongs/Shuttle 66.mp3", image: "bookSongsCovers/Stellar Hearts.png" },
        { audio: "bookSongs/Who Are You.mp3", image: "bookSongsCovers/Stellar Hearts.png" },
        { audio: "bookSongs/Sunrise.mp3", image: "bookSongsCovers/ForgottenBeginning.png" },
        { audio: "bookSongs/How To Say Goodbye.mp3", image: "bookSongsCovers/Blu.png" },
        { audio: "bookSongs/Eternal Dusk.mp3", image: "bookSongsCovers/Blu.png" },
        { audio: "bookSongs/Into The Light.mp3", image: "bookSongsCovers/Blu.png" },
        { audio: "bookSongs/The Light Was Always Me (Female Version).mp3", image: "bookSongsCovers/GravityThief.png" },
        
  ];

  function parseFilename(url){
    try {
      const clean = url.split('?')[0];
      const raw = decodeURIComponent(clean.substring(clean.lastIndexOf('/') + 1));
      const noExt = raw.replace(/\.[^/.]+$/, '');
      const parts = noExt.split(/\s*-\s*/);
      if (parts.length >= 2){
        return { artist: titleCase(parts[0]), title: titleCase(parts.slice(1).join(' - ')) };
      }
      return { artist: 'Unknown Artist', title: titleCase(noExt) };
    } catch(e){
      return { artist: 'Unknown Artist', title: url };
    }
  }
  function titleCase(s){
    return s.replace(/[_]+/g,' ').trim().replace(/\w\S*/g, w => w[0].toUpperCase() + w.slice(1));
  }

  const songs = trackData.map((t, i) => {
    const meta = parseFilename(t.audio);
    return { id:i, url:t.audio, image:t.image || null, title:meta.title, artist:meta.artist, dur:null };
  });

  const liked = new Set();
  const added = new Set();

  let queue = songs.map(s => s.id);
  let pos = 0;
  let playing = false;

  const audio = new Audio();
  audio.preload = 'metadata';

  const svg = document.getElementById('landscape');
  const landscapeImg = document.getElementById('landscapeImg');
  const artLayer = document.getElementById('artLayer');
  const queueList = document.getElementById('queueList');
  const trackTitle = document.getElementById('trackTitle');
  const trackArtist = document.getElementById('trackArtist');
  const progressFill = document.getElementById('progressFill');
  const progressTrack = document.getElementById('progressTrack');
  const curTimeEl = document.getElementById('curTime');
  const totalTimeEl = document.getElementById('totalTime');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const likeBtn = document.getElementById('likeBtn');
  const addBtn = document.getElementById('addBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');

  function mulberry32(seed){
    return function(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function fmt(s){
    if (s == null || isNaN(s)) return '--:--';
    s = Math.floor(s);
    const m = Math.floor(s/60), r = s%60;
    return m + ':' + String(r).padStart(2,'0');
  }

  function buildLandscape(songId){
    const rnd = mulberry32(songId * 977 + 13);
    const hue = 250 + Math.floor(rnd()*70);
    const skyTop = `hsl(${hue}, 32%, 9%)`;
    const skyMid = `hsl(${hue+10}, 28%, 14%)`;
    const skyBottom = `hsl(${(hue+300)%360}, 20%, 6%)`;
    const moonWarm = songId % 2 === 0;
    const moonColor = moonWarm ? '#e7d3a1' : '#cdd3d8';
    const moonX = 260 + rnd()*680;
    const moonY = 130 + rnd()*90;
    const moonR = 46 + rnd()*10;
    const phase = rnd();

    let defs = `<defs>
      <linearGradient id="sky${songId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${skyTop}"/>
        <stop offset="55%" stop-color="${skyMid}"/>
        <stop offset="100%" stop-color="${skyBottom}"/>
      </linearGradient>
    </defs>`;

    let out = `<rect x="0" y="0" width="1200" height="750" fill="url(#sky${songId})"/>`;

    out += `<g stroke="${moonColor}" stroke-opacity="0.10" fill="none">`;
    for (let i=1;i<=3;i++){
      out += `<circle cx="${moonX}" cy="${moonY}" r="${moonR + i*34}" stroke-width="1"/>`;
    }
    out += `</g>`;

    out += `<g fill="${moonColor}" opacity="0.75">`;
    for (let i=0;i<70;i++){
      const sx = rnd()*1200, sy = rnd()*420, sr = rnd()*1.4 + 0.3;
      out += `<circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${sr.toFixed(2)}"/>`;
    }
    out += `</g>`;

    out += `<mask id="moonMask${songId}">
        <rect x="0" y="0" width="1200" height="750" fill="white"/>
        <circle cx="${moonX + (phase-0.5)*moonR*2.1}" cy="${moonY}" r="${moonR}" fill="black"/>
      </mask>
      <circle cx="${moonX}" cy="${moonY}" r="${moonR}" fill="${moonColor}" mask="url(#moonMask${songId})"/>
      <circle cx="${moonX}" cy="${moonY}" r="${moonR}" fill="none" stroke="${moonColor}" stroke-opacity="0.25"/>`;

    out += buildSkylineLayer(rnd, 470, `hsl(${hue}, 20%, 8%)`, 0.55, 0.9);
    out += buildSkylineLayer(rnd, 560, `hsl(${(hue+340)%360}, 22%, 5%)`, 0.85, 1.25);

    svg.innerHTML = defs + out;
  }

  function buildSkylineLayer(rnd, baseY, color, heightScale, widthScale){
    let x = -20;
    let d = `M -20 750 `;
    while (x < 1230){
      const w = (40 + rnd()*70) * widthScale;
      const h = (60 + rnd()*220) * heightScale;
      const topY = baseY - h;
      const spireTip = rnd() > 0.6;
      d += `L ${x.toFixed(0)} ${baseY.toFixed(0)} `;
      if (spireTip){
        const midx = x + w*0.5;
        d += `L ${midx.toFixed(0)} ${(topY-30).toFixed(0)} L ${(x+w).toFixed(0)} ${baseY.toFixed(0)} `;
      } else {
        d += `L ${x.toFixed(0)} ${topY.toFixed(0)} L ${(x+w).toFixed(0)} ${topY.toFixed(0)} L ${(x+w).toFixed(0)} ${baseY.toFixed(0)} `;
      }
      x += w + rnd()*8;
    }
    d += `L 1230 750 Z`;
    return `<path d="${d}" fill="${color}"/>`;
  }

  function toRoman(num){
    const map = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];
    let res = '';
    for (const [v,s] of map){ while(num>=v){ res+=s; num-=v; } }
    return res;
  }

  function renderQueueList(){
    queueList.innerHTML = '';
    const count = Math.min(4, queue.length - 1);
    for (let i=1;i<=count;i++){
      const songId = queue[(pos+i) % queue.length];
      const song = songs[songId];
      const li = document.createElement('li');
      li.className = 'entering';
      li.tabIndex = 0;
      li.innerHTML = `<span class="roman">${toRoman(i)}</span>
        <span class="meta">
          <div class="qtitle">${song.title}</div>
          <div class="qartist">${song.artist}</div>
        </span>`;
      const targetPos = (pos+i) % queue.length;
      li.addEventListener('click', () => jumpTo(targetPos));
      li.addEventListener('keydown', e => { if (e.key==='Enter') jumpTo(targetPos); });
      queueList.appendChild(li);
      requestAnimationFrame(() => li.classList.remove('entering'));
    }
  }

  function renderNowPlaying(){
    const song = songs[queue[pos]];
    trackTitle.textContent = song.title;
    trackArtist.textContent = song.artist;
    totalTimeEl.textContent = fmt(song.dur);
    curTimeEl.textContent = fmt(audio.currentTime);
    const pct = song.dur ? (audio.currentTime / song.dur) * 100 : 0;
    progressFill.style.width = pct + '%';
    likeBtn.classList.toggle('active', liked.has(song.id));
    addBtn.classList.toggle('active', added.has(song.id));
  }

  function renderVisual(song){
    if (song.image){
      svg.style.display = 'none';
      landscapeImg.style.display = 'block';
      landscapeImg.src = song.image;
      landscapeImg.onerror = () => {
        // image failed to load — fall back to generated art instead of a broken image
        landscapeImg.style.display = 'none';
        svg.style.display = 'block';
        buildLandscape(song.id);
      };
    } else {
      landscapeImg.style.display = 'none';
      svg.style.display = 'block';
      buildLandscape(song.id);
    }
  }

  function crossfadeVisual(){
    artLayer.classList.add('fading');
    setTimeout(() => {
      renderVisual(songs[queue[pos]]);
      artLayer.classList.remove('fading');
    }, 260);
  }

  function loadCurrentTrack(autoplay){
    const song = songs[queue[pos]];
    audio.src = song.url;
    audio.currentTime = 0;
    audio.onloadedmetadata = () => {
      song.dur = audio.duration;
      renderNowPlaying();
    };
    audio.onerror = () => {
      trackTitle.textContent = song.title + ' (could not load audio)';
    };
    if (autoplay) audio.play().catch(()=>{});
  }

  function renderAll(){
    renderNowPlaying();
    renderQueueList();
  }

  function jumpTo(newPos){
    pos = newPos;
    crossfadeVisual();
    loadCurrentTrack(playing);
    renderAll();
  }

  function goNext(){
    pos = (pos+1) % queue.length;
    crossfadeVisual();
    loadCurrentTrack(playing);
    renderAll();
  }
  function goPrev(){
    if (audio.currentTime > 3){
      audio.currentTime = 0;
      renderNowPlaying();
      return;
    }
    pos = (pos-1+queue.length) % queue.length;
    crossfadeVisual();
    loadCurrentTrack(playing);
    renderAll();
  }

  function setPlaying(v){
    playing = v;
    playIcon.innerHTML = playing
      ? `<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>`
      : `<path d="M7 5l13 7-13 7z"/>`;
    playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
    playBtn.title = playing ? 'Pause' : 'Play';
    if (playing){
      audio.play().catch(()=>{});
    } else {
      audio.pause();
    }
  }

  audio.addEventListener('timeupdate', renderNowPlaying);
  audio.addEventListener('ended', goNext);

  playBtn.addEventListener('click', () => setPlaying(!playing));
  document.getElementById('nextBtn').addEventListener('click', goNext);
  document.getElementById('prevBtn').addEventListener('click', goPrev);

  likeBtn.addEventListener('click', () => {
    const id = songs[queue[pos]].id;
    liked.has(id) ? liked.delete(id) : liked.add(id);
    renderNowPlaying();
  });
  addBtn.addEventListener('click', () => {
    const id = songs[queue[pos]].id;
    added.has(id) ? added.delete(id) : added.add(id);
    renderNowPlaying();
  });

  shuffleBtn.addEventListener('click', () => {
    const before = queue.slice(0, pos+1);
    const after = queue.slice(pos+1);
    for (let i = after.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [after[i], after[j]] = [after[j], after[i]];
    }
    queue = before.concat(after);
    shuffleBtn.classList.add('active');
    setTimeout(() => shuffleBtn.classList.remove('active'), 900);
    renderQueueList();
  });

  progressTrack.addEventListener('click', (e) => {
    const song = songs[queue[pos]];
    if (!song.dur) return;
    const rect = progressTrack.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    audio.currentTime = song.dur * ratio;
    renderNowPlaying();
  });

  // init
  renderVisual(songs[queue[pos]]);
  loadCurrentTrack(false);
  renderAll();
})();
</script>

</body>
</html>
